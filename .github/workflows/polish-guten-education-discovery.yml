name: Polish Guten education discovery

on:
  push:
    branches:
      - polish/guten-education-reader-screens

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply discovery polish
        run: python scripts/polish_guten_education.py
      - name: Commit discovery polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guten/education/index.html llms.txt sitemap.xml
          git diff --cached --stat
          git commit -m 'Polish Guten education SEO and discovery' || exit 0
          git push
