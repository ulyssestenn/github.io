name: Inspect Guten reader screenshots

on:
  push:
    branches:
      - fix/guten-education-contrast-covers

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr >/dev/null
      - name: OCR reader screenshot titles
        run: |
          for f in assets/screenshots/guten/reading_light.png assets/screenshots/guten/reading_dark.png assets/screenshots/guten/reading_sepia.png; do
            echo "===== $f ====="
            # Full-screen OCR; title/author text normally appears near the top.
            tesseract "$f" stdout --psm 6 2>/dev/null | head -n 18 || true
          done
