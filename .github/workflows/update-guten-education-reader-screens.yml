name: Consolidate Guten education free features

on:
  push:
    branches:
      - polish/guten-education-reader-screens

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate free feature list
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('guten/education/index.html')
          text = page.read_text()

          new_list = '''            <ul class="checks">
              <li>Browse and search Project Gutenberg</li>
              <li>Download complete books</li>
              <li>Read complete books offline</li>
              <li>Automatic reading progress</li>
              <li>Bookmarks</li>
              <li>Highlight passages</li>
              <li>Add notes to passages</li>
              <li>Review and search annotations within each book</li>
              <li>Search within a book</li>
              <li>Definition lookup</li>
              <li>Customizable typography: fonts, size, spacing, margins, and justification</li>
              <li>Reader themes: light, dark, sepia, and system</li>
              <li>Accessibility support: Atkinson Hyperlegible, TalkBack, and Android font scaling</li>
              <li>Swipe and chapter/leaf navigation</li>
              <li>Daily reading goals</li>
              <li>Reading streaks and statistics</li>
              <li>Library search and sorting</li>
              <li>Wi-Fi-only download option</li>
              <li>Full backup export and restore</li>
              <li>Basic Share Studio with save/share quote cards</li>
              <li>Plain-text quote sharing</li>
            </ul>'''

          pattern = r'            <ul class="checks">.*?            </ul>'
          text, count = re.subn(pattern, new_list, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise RuntimeError(f'Expected one free-feature list; found {count}')

          page.write_text(text)
          PY
      - name: Commit free feature editorial pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guten/education/index.html
          git diff --cached --stat
          git commit -m 'Consolidate Guten free feature list' || exit 0
          git push
