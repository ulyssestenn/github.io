name: Render Knowledge batch

on:
  push:
    paths:
      - '_publish_batch/READY'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown
      - run: python tools/render_knowledge_batch.py
      - name: Commit rendered Knowledge pages
        run: |
          rm -rf _publish_batch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Render Knowledge batch"
          git push
