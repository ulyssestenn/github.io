name: Review Guten education share card

on:
  push:
    branches:
      - polish/guten-education-reader-screens

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: guten-education-share
          path: assets/guten/education/guten-education-share.jpg
          if-no-files-found: error
