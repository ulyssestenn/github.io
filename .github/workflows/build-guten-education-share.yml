name: Export Guten education share card for review

on:
  push:
    branches:
      - polish/guten-education-reader-screens

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export generated share card as review text
        run: |
          mkdir -p .tmp
          base64 -w0 assets/guten/education/guten-education-share.jpg > .tmp/guten-education-share.b64
      - name: Commit review export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/guten-education-share.b64
          git commit -m 'Temporarily export Guten education share card' || exit 0
          git push
