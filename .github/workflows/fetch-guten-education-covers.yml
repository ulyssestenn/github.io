name: Fetch Guten education covers

on:
  push:
    branches:
      - editorial/guten-education-v2
    paths:
      - '.github/workflows/fetch-guten-education-covers.yml'

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/guten-education-v2
      - name: Download and optimize Project Gutenberg covers
        run: |
          python -m pip install --quiet pillow
          mkdir -p assets/guten/education/covers
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          covers = {
              'alice.jpg': 'https://www.gutenberg.org/cache/epub/11/pg11.cover.medium.jpg',
              'secret-garden.jpg': 'https://www.gutenberg.org/cache/epub/17396/pg17396.cover.medium.jpg',
              'anne-of-green-gables.jpg': 'https://www.gutenberg.org/cache/epub/45/pg45.cover.medium.jpg',
              'little-women.jpg': 'https://www.gutenberg.org/cache/epub/514/pg514.cover.medium.jpg',
              'sherlock-holmes.jpg': 'https://www.gutenberg.org/cache/epub/1661/pg1661.cover.medium.jpg',
              'pride-and-prejudice.jpg': 'https://www.gutenberg.org/cache/epub/1342/pg1342.cover.medium.jpg',
              'frankenstein.jpg': 'https://www.gutenberg.org/cache/epub/84/pg84.cover.medium.jpg',
          }
          out = Path('assets/guten/education/covers')
          for filename, url in covers.items():
              req = Request(url, headers={'User-Agent': 'Ulix website asset fetch/1.0'})
              with urlopen(req, timeout=30) as response:
                  data = response.read()
              im = Image.open(BytesIO(data)).convert('RGB')
              im.thumbnail((320, 480), Image.Resampling.LANCZOS)
              im.save(out / filename, 'JPEG', quality=82, optimize=True, progressive=True)
              print(filename, im.size)
          PY
      - name: Commit cover assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/guten/education/covers
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add local Guten education cover assets'
          git push origin HEAD:editorial/guten-education-v2
