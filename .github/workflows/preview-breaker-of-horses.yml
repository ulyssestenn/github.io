name: Breaker of Horses preview

on:
  pull_request:
    paths:
      - 'breakerofhorses/**'
      - 'assets/screenshots/breaker_of_horses/**'
      - '.github/workflows/preview-breaker-of-horses.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct page heading colors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('breakerofhorses/styles.css')
          css = path.read_text(encoding='utf-8')
          anchor = """.boh-page h1,
          .boh-page h2,
          .boh-page h3,
          .boh-page p,
          .boh-page figure { margin: 0; }"""
          rule = """

          .boh-page h1,
          .boh-page h2,
          .boh-page h3 { color: inherit; }"""

          if rule.strip() not in css:
              if anchor not in css:
                  raise SystemExit('Could not find CSS reset anchor')
              path.write_text(css.replace(anchor, anchor + rule, 1), encoding='utf-8')
          PY

          if ! git diff --quiet -- breakerofhorses/styles.css; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add breakerofhorses/styles.css
            git commit -m 'Fix Breaker of Horses heading colors'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render screenshots
        run: |
          mkdir -p preview
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/boh-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          cat > render-preview.js <<'EOF'
          const { chromium } = require('playwright');

          async function prepare(page, url) {
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              for (let y = 0; y < document.body.scrollHeight; y += 700) {
                window.scrollTo(0, y);
                await pause(90);
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(800);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const url = 'http://127.0.0.1:8000/breakerofhorses/';

            const desktop = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
            });
            await prepare(desktop, url);
            await desktop.screenshot({ path: 'preview/breaker-desktop-top.png' });
            await desktop.screenshot({ path: 'preview/breaker-desktop-full.png', fullPage: true });

            const mobile = await browser.newPage({
              viewport: { width: 412, height: 915 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
            });
            await prepare(mobile, url);
            await mobile.screenshot({ path: 'preview/breaker-mobile-top.png' });
            await mobile.screenshot({ path: 'preview/breaker-mobile-full.png', fullPage: true });

            await browser.close();
          })();
          EOF
          node render-preview.js

      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: breaker-of-horses-preview
          path: preview/*.png
          if-no-files-found: error
          retention-days: 7
