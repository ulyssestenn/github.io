name: Fix Scepter icon

on:
  push:
    branches:
      - agent/use-correct-scepter-icon

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-correct-scepter-icon

      - name: Use the uploaded Scepter icon
        run: |
          set -euo pipefail
          test -s assets/scepter/sceptericon.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('apps.html')
          html = path.read_text(encoding='utf-8')
          old = 'icons/scepter.webp'
          new = 'assets/scepter/sceptericon.png'

          if old in html:
              html = html.replace(old, new)

          assert old not in html
          assert html.count(new) == 2

          for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S):
              json.loads(block)

          path.write_text(html, encoding='utf-8')
          PY
          git rm -f icons/scepter.webp

      - name: Commit the correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.html
          if ! git diff --cached --quiet; then
            git commit -m 'Use the correct Scepter icon'
            git push origin HEAD:agent/use-correct-scepter-icon
          fi
