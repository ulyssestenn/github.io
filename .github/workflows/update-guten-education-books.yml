name: Update Guten education books

on:
  push:
    branches:
      - fix/guten-education-contrast-covers

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Fetch covers and update page
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import io, requests
          from bs4 import BeautifulSoup
          from PIL import Image

          session = requests.Session()
          session.headers['User-Agent'] = 'Ulix/1.0 (education landing-page asset preparation)'
          out = Path('assets/guten/education/covers')
          out.mkdir(parents=True, exist_ok=True)

          # Chosen for visual interest as well as educational recognition:
          # 46 = original 1843 first-edition A Christmas Carol cover
          # 47960 = illustrated Romeo and Juliet edition
          # 23 = Frederick Douglass narrative
          books = {
              'a-christmas-carol.jpg': 46,
              'romeo-and-juliet.jpg': 47960,
              'frederick-douglass.jpg': 23,
          }

          def fetch_cover(book_id):
              page_url = f'https://www.gutenberg.org/ebooks/{book_id}'
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, 'html.parser')
              candidates = []
              for img in soup.find_all('img'):
                  src = img.get('src') or ''
                  alt = img.get('alt') or ''
                  if 'cover' in src.lower() or 'book cover' in alt.lower() or 'cover' in alt.lower():
                      candidates.append(urljoin(page_url, src))
              candidates += [
                  f'https://www.gutenberg.org/cache/epub/{book_id}/pg{book_id}.cover.medium.jpg',
                  f'https://www.gutenberg.org/cache/epub/{book_id}/pg{book_id}.cover.small.jpg',
              ]
              seen = set()
              for url in candidates:
                  if not url or url in seen:
                      continue
                  seen.add(url)
                  try:
                      rr = session.get(url, timeout=30)
                      rr.raise_for_status()
                      im = Image.open(io.BytesIO(rr.content))
                      im.load()
                      return im.convert('RGB')
                  except Exception:
                      pass
              raise RuntimeError(f'No usable cover found for Project Gutenberg ebook {book_id}')

          for filename, book_id in books.items():
              im = fetch_cover(book_id)
              im.thumbnail((360, 540), Image.Resampling.LANCZOS)
              im.save(out / filename, 'JPEG', quality=80, optimize=True, progressive=True)
              print(filename, im.size, (out / filename).stat().st_size)

          for old in ['secret-garden.jpg', 'anne-of-green-gables.jpg', 'little-women.jpg']:
              p = out / old
              if p.exists():
                  p.unlink()

          path = Path('guten/education/index.html')
          text = path.read_text()

          old_hero = '<figure class="shot shot--front"><img src="../../assets/screenshots/guten/browse.webp" alt="Guten Browse screen" width="1080" height="2119" /></figure>'
          new_hero = '<figure class="shot shot--front"><img src="../../assets/screenshots/guten/reading_light.webp" alt="Guten Reader showing Hesiod’s Works and Days" width="1080" height="2153" /></figure>'
          if old_hero not in text:
              raise RuntimeError('Hero screenshot target not found')
          text = text.replace(old_hero, new_hero, 1)

          old_cards = '''          <a class="cover-card" href="https://www.gutenberg.org/ebooks/17396" target="_blank" rel="noopener"><div class="cover-frame"><img src="../../assets/guten/education/covers/secret-garden.jpg" alt="Project Gutenberg cover of The Secret Garden" loading="lazy" /></div><div class="cover-meta"><div class="cover-age">Younger</div><div class="cover-title">The Secret Garden</div><div class="cover-author">Frances Hodgson Burnett</div></div></a>
          <a class="cover-card" href="https://www.gutenberg.org/ebooks/45" target="_blank" rel="noopener"><div class="cover-frame"><img src="../../assets/guten/education/covers/anne-of-green-gables.jpg" alt="Project Gutenberg cover of Anne of Green Gables" loading="lazy" /></div><div class="cover-meta"><div class="cover-age">Younger / teen</div><div class="cover-title">Anne of Green Gables</div><div class="cover-author">L. M. Montgomery</div></div></a>
          <a class="cover-card" href="https://www.gutenberg.org/ebooks/514" target="_blank" rel="noopener"><div class="cover-frame"><img src="../../assets/guten/education/covers/little-women.jpg" alt="Project Gutenberg cover of Little Women" loading="lazy" /></div><div class="cover-meta"><div class="cover-age">Teen / secondary</div><div class="cover-title">Little Women</div><div class="cover-author">Louisa May Alcott</div></div></a>'''
          new_cards = '''          <a class="cover-card" href="https://www.gutenberg.org/ebooks/46" target="_blank" rel="noopener"><div class="cover-frame"><img src="../../assets/guten/education/covers/a-christmas-carol.jpg" alt="Project Gutenberg cover of A Christmas Carol" loading="lazy" /></div><div class="cover-meta"><div class="cover-age">Secondary</div><div class="cover-title">A Christmas Carol</div><div class="cover-author">Charles Dickens</div></div></a>
          <a class="cover-card" href="https://www.gutenberg.org/ebooks/47960" target="_blank" rel="noopener"><div class="cover-frame"><img src="../../assets/guten/education/covers/romeo-and-juliet.jpg" alt="Project Gutenberg cover of Romeo and Juliet" loading="lazy" /></div><div class="cover-meta"><div class="cover-age">Secondary</div><div class="cover-title">Romeo and Juliet</div><div class="cover-author">William Shakespeare</div></div></a>
          <a class="cover-card" href="https://www.gutenberg.org/ebooks/23" target="_blank" rel="noopener"><div class="cover-frame"><img src="../../assets/guten/education/covers/frederick-douglass.jpg" alt="Project Gutenberg cover of Narrative of the Life of Frederick Douglass" loading="lazy" /></div><div class="cover-meta"><div class="cover-age">Secondary / university</div><div class="cover-title">Narrative of the Life of Frederick Douglass</div><div class="cover-author">Frederick Douglass</div></div></a>'''
          if old_cards not in text:
              raise RuntimeError('Old literature cards not found')
          text = text.replace(old_cards, new_cards, 1)
          path.write_text(text)
          PY
      - name: Commit generated assets and page changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/guten/education/covers guten/education/index.html
          git diff --cached --stat
          git commit -m 'Refine education literature examples and hero' || exit 0
          git push
